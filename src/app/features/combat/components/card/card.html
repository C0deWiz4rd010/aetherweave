<div class="cost">{{ card().cost }}</div>
<div class="art">
  <span class="glyph">{{ elementGlyph() || '✦' }}</span>
</div>
<div class="title">{{ card().name }}</div>
<div class="type">
  {{ card().type }}@if (card().element) { · {{ card().element }} }
</div>
<div class="desc">{{ card().description }}</div>
@if (card().exhaust) {
  <div class="exhaust">Exhaust</div>
}
